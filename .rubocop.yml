AllCops:
  TargetRubyVersion: 3.2

# Be lenient with line length
Layout/LineLength:
  Max: 92

# Spec describe blocks can be any size
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
